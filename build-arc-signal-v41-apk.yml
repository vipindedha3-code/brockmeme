name: Build ARC SIGNAL V4.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-arc-signal-v41-apk.yml'
      - 'ARC_SIGNAL_V4_1_ANDROID_GITHUB_BUILD.zip'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f ARC_SIGNAL_V4_1_ANDROID_GITHUB_BUILD.zip || { echo 'Missing ARC_SIGNAL_V4_1_ANDROID_GITHUB_BUILD.zip in repository root'; exit 1; }
          python3 -m zipfile -e ARC_SIGNAL_V4_1_ANDROID_GITHUB_BUILD.zip .
          test -f arc_signal_android/settings.gradle
          test -f arc_signal_android/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        run: gradle --no-daemon -p arc_signal_android :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ARC_SIGNAL_V4_1_Android_APK
          path: arc_signal_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
